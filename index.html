              physCheckText = '소지품·착석 확인: 전자기기 및 부정행위 정황 없음';
              physCheckColor = '#047857';
            }
          }

          elLaterBody.innerHTML =
            '<div class="later-split">' +
              '<aside class="later-queue">' + queueHtml + '</aside>' +
              '<div class="later-detail">' +
                '<div class="student-head" style="padding-bottom:12px;">' +
                  '<div>' +
                    '<div class="student-meta mono-num">' + escapeHtml(active.seatLabel) + ' · 보류 (추후 검사 대상)</div>' +
                    '<h3 class="student-name">' + escapeHtml(active.name) + '</h3>' +
                  '</div>' +
                  (active.suspectedCheating ? '<span style="padding:4px 10px;border-radius:6px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:12px;font-weight:600;">전파+행동 동시 의심</span>' : '') +
                '</div>' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
                  '<div class="evidence-box"><div class="evidence-box-top"><span>기존 교실 전파 기록</span></div><p class="evidence-box-desc">' + (active.rfLastInfo ? escapeHtml(active.rfLastInfo.directionText + ' · ' + active.rfLastInfo.band) : '교실 감시 중 전파 미감지') + '</p></div>' +
                  '<div class="evidence-box"><div class="evidence-box-top"><span>기존 CCTV 행동 기록</span></div><p class="evidence-box-desc">' + (active.cctvLastInfo ? escapeHtml(active.cctvLastInfo.behaviorText) : 'CCTV 특이 행동 미포착') + '</p></div>' +
                '</div>' +
                '<div style="display:flex;flex-direction:column;gap:10px;">' +
                  '<div style="font-size:12px;font-weight:600;color:#334155;">정밀 검사 절차 (실제 전자기기 소지 여부 확인)</div>' +
                  '<div class="step-card">' +
                    '<div><div style="font-size:13px;font-weight:600;color:#0f172a;">1. 휴대용 스캐너 초근접(0.5m) 전파 검사</div><p style="margin:4px 0 0;font-size:12px;color:' + rfCheckColor + ';">' + rfCheckText + '</p></div>' +
                    '<button type="button" class="btn-scan" data-hold-rf="' + active.id + '"' + (active.holdRfChecked ? ' disabled' : '') + '>' + (active.holdRfChecked ? '스캔 완료' : '근접 스캔 실행') + '</button>' +
                  '</div>' +
                  '<div class="step-card">' +
                    '<div><div style="font-size:13px;font-weight:600;color:#0f172a;">2. 소지품 · 착용물 대면 물리 검사</div><p style="margin:4px 0 0;font-size:12px;color:' + physCheckColor + ';">' + physCheckText + '</p></div>' +
                    '<button type="button" class="btn-scan" style="background:' + (active.holdPhysicalChecked ? '' : '#0f172a') + ';" data-hold-phys="' + active.id + '"' + (active.holdPhysicalChecked ? ' disabled' : '') + '>' + (active.holdPhysicalChecked ? '확인 완료' : '소지품 검사') + '</button>' +
                  '</div>' +
                '</div>' +
                '<div style="padding-top:12px;border-top:1px solid #f1f5f9;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;">' +
                  '<span style="font-size:12px;color:#64748b;">검사 결과를 바탕으로 최종 감독관 판정을 내리세요.</span>' +
                  '<div style="display:flex;gap:8px;">' +
                    '<button type="button" class="btn-clear" data-clear-student="' + active.id + '">정상 판정 (보류 해제)</button>' +
                    '<button type="button" class="btn-expel" data-expel-student="' + active.id + '">최종 퇴실 조치</button>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>';
        }

        function renderResultModal() {
          if (!state.resultModalOpen) {
            elResultModal.classList.add('hidden');
            return;
          }
          elResultModal.classList.remove('hidden');

          var our = getOurStudents();
          var cheaters = our.filter(function (s) { return s.scenario === 'cheater'; });
          var caught = cheaters.filter(function (s) { return s.status === 'expelled'; });
          var missed = cheaters.filter(function (s) { return s.status !== 'expelled'; });
          var falseExp = our.filter(function (s) { return s.status === 'expelled' && s.scenario !== 'cheater'; });
          var stillHeld = our.filter(function (s) { return s.status === 'held'; });

          elResultKicker.textContent = state.session.periodNumber + '교시 ' + state.session.subjectName + ' 감독 결산';
          elBtnStartNext.textContent = (state.session.periodNumber + 1) + '교시 다음 시험 시작 →';

          var heldWarning = stillHeld.length > 0
            ? '<div class="callout-box warning" style="margin-top:0;justify-content:space-between;align-items:center;">' +
                '<span>현재 <strong>보류(추후 검사)</strong> 상태인 학생이 ' + stillHeld.length + '명 있습니다. 추후 정밀 검사를 먼저 진행할 수 있습니다.</span>' +
                '<button type="button" class="btn-primary-dark" style="background:#b45309;" data-open-later="' + stillHeld[0].id + '">보류 학생 추후 검사하기</button>' +
              '</div>'
            : '';

          var cheaterRows = cheaters.map(function (c) {
            var ok = c.status === 'expelled';
            return '<div style="padding:12px 16px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;">' +
              '<div>' +
                '<strong>' + escapeHtml(c.name) + '</strong> <span class="mono-num" style="color:#64748b;">' + escapeHtml(c.seatLabel) + '</span>' +
                '<div style="color:#475569;margin-top:2px;">' + escapeHtml(c.deviceType) + ' (' + escapeHtml(c.rfBand) + ') · ' + escapeHtml(c.behaviorLabel) + '</div>' +
              '</div>' +
              '<span style="font-weight:600;color:' + (ok ? '#047857' : '#dc2626') + ';white-space:nowrap;">' + (ok ? '적발 완료' : '미적발 (' + (c.status === 'held' ? '보류 중' : '응시 완료') + ')') + '</span>' +
            '</div>';
          }).join('');

          var falseSection = falseExp.length > 0
            ? '<div><h3 style="margin:0 0 8px;font-size:14px;font-weight:600;color:#b91c1c;">오인 퇴실 내역</h3>' +
              '<div style="border:1px solid #fecaca;border-radius:8px;background:rgba(254,242,242,0.4);">' +
                falseExp.map(function (f) {
                  return '<div style="padding:10px 14px;border-bottom:1px solid #fee2e2;display:flex;justify-content:space-between;font-size:12px;">' +
                    '<strong>' + escapeHtml(f.name) + ' (' + escapeHtml(f.seatLabel) + ')</strong>' +
                    '<span style="color:#475569;">' + escapeHtml(f.deviceType || f.behaviorLabel || '특이사항 없음 (일반 응시자)') + '</span>' +
                  '</div>';
                }).join('') +
              '</div></div>'
            : '';

          elResultBody.innerHTML =
            '<div class="kpi-grid">' +
              '<div class="kpi-card"><p class="kpi-label">실제 부정행위자</p><p class="kpi-val mono-num">' + cheaters.length + '명</p></div>' +
              '<div class="kpi-card emerald"><p class="kpi-label" style="color:#047857;">적발 퇴실 성공</p><p class="kpi-val mono-num" style="color:#064e3b;">' + caught.length + '명</p></div>' +
              '<div class="kpi-card amber"><p class="kpi-label" style="color:#92400e;">미적발 인원</p><p class="kpi-val mono-num" style="color:#78350f;">' + missed.length + '명</p></div>' +
              '<div class="kpi-card red"><p class="kpi-label" style="color:#b91c1c;">오인 퇴실</p><p class="kpi-val mono-num" style="color:#7f1d1d;">' + falseExp.length + '명</p></div>' +
            '</div>' +
            heldWarning +
            '<div><h3 style="margin:0 0 8px;font-size:14px;font-weight:600;color:#0f172a;">제1시험실 전자기기 부정행위자 실제 내역</h3>' +
            '<div style="border:1px solid #e2e8f0;border-radius:8px;">' + cheaterRows + '</div></div>' +
            falseSection;
        }

        function renderAll() {
          renderHeaderAndToolbar();
          renderStage();
          renderSubtitleBar();
          renderStudentDetail();
          renderTabs();
          renderLaterModal();
          renderResultModal();
        }

        // Event Helpers
        function getSvgCoords(e) {
          var rect = elSvg.getBoundingClientRect();
          return {
            x: ((e.clientX - rect.left) / rect.width) * STAGE_WIDTH,
            y: ((e.clientY - rect.top) / rect.height) * STAGE_HEIGHT
          };
        }

        function aimHeadAt(x, y) {
          var rawAngle = radToDeg(Math.atan2(y - PROCTOR_DESK.y, x - PROCTOR_DESK.x));
          var offset = rawAngle - 90;
          if (offset > 180) offset -= 360;
          if (offset < -180) offset += 360;
          state.autoSweep = false;
          state.headOffsetDeg = Math.max(-68, Math.min(68, Math.round(offset)));
          runRfScan();
          renderHeaderAndToolbar();
          renderStage();
          renderSubtitleBar();
          renderStudentDetail();
          renderTabs();
        }

        // Event Listeners
        elBtnViewProctor.addEventListener('click', function () {
          state.viewMode = 'proctor';
          runRfScan();
          renderAll();
        });
        elBtnViewCctv.addEventListener('click', function () {
          state.viewMode = 'cctv';
          renderAll();
        });
        elBtnPostureFixed.addEventListener('click', function () {
          state.proctorPosture = 'fixed';
          state.walkTarget = null;
          runRfScan();
          renderAll();
        });
        elBtnPosturePatrol.addEventListener('click', function () {
          state.proctorPosture = 'patrol';
          state.autoSweep = false;
          runRfScan();
          renderAll();
        });

        document.getElementById('btn-turn-left').addEventListener('click', function () {
          state.autoSweep = false;
          state.headOffsetDeg = Math.min(68, state.headOffsetDeg + 15);
          runRfScan();
          renderAll();
        });
        document.getElementById('btn-turn-right').addEventListener('click', function () {
          state.autoSweep = false;
          state.headOffsetDeg = Math.max(-68, state.headOffsetDeg - 15);
          runRfScan();
          renderAll();
        });
        elAngleSlider.addEventListener('input', function (e) {
          state.autoSweep = false;
          state.headOffsetDeg = -Number(e.target.value);
          runRfScan();
          renderHeaderAndToolbar();
          renderStage();
          renderSubtitleBar();
          renderStudentDetail();
          renderTabs();
        });
        elBtnAutoSweep.addEventListener('click', function () {
          state.autoSweep = !state.autoSweep;
          renderHeaderAndToolbar();
        });
        document.getElementById('btn-return-desk').addEventListener('click', function () {
          state.walkTarget = { x: PROCTOR_DESK.x, y: PROCTOR_DESK.y + 36 };
        });

        elBtnOpenLater.addEventListener('click', function () {
          state.laterTargetId = null;
          state.resultModalOpen = false;
          state.laterModalOpen = true;
          renderAll();
        });
        elBtnPause.addEventListener('click', function () {
          state.isPaused = !state.isPaused;
          renderHeaderAndToolbar();
        });
        elBtnSpeed.addEventListener('click', function () {
          state.simSpeed = state.simSpeed === 1 ? 2 : 1;
          renderHeaderAndToolbar();
        });

        document.getElementById('btn-open-next-exam').addEventListener('click', function () {
          state.resultModalOpen = true;
          renderResultModal();
        });
        document.getElementById('btn-close-result').addEventListener('click', function () {
          state.resultModalOpen = false;
          renderResultModal();
        });
        document.getElementById('btn-continue-proctor').addEventListener('click', function () {
          state.resultModalOpen = false;
          renderResultModal();
        });
        elBtnStartNext.addEventListener('click', function () {
          var nextPeriod = state.session.periodNumber + 1;
          state.session = generateExamSession(nextPeriod);
          state.selectedStudentId = null;
          state.subtitleLog = [];
          state.activeSubtitle = null;
          state.proctorPosture = 'fixed';
          state.viewMode = 'proctor';
          state.headOffsetDeg = 0;
          state.autoSweep = false;
          state.proctorPos = { x: PROCTOR_DESK.x, y: PROCTOR_DESK.y };
          state.walkTarget = null;
          lastRfAlertAt = {};
          lastCctvAlertAt = {};
          state.resultModalOpen = false;
          state.laterModalOpen = false;
          state.isPaused = false;
          renderAll();
        });
        document.getElementById('btn-close-later').addEventListener('click', function () {
          state.laterModalOpen = false;
          renderLaterModal();
        });

        elTabSubtitles.addEventListener('click', function () { state.activeTab = 'subtitles'; renderTabs(); });
        elTabHeld.addEventListener('click', function () { state.activeTab = 'held'; renderTabs(); });
        elTabActions.addEventListener('click', function () { state.activeTab = 'actions'; renderTabs(); });

        // SVG Pointer Interactions
        elSvg.addEventListener('pointerdown', function (e) {
          var studentEl = e.target.closest ? e.target.closest('[data-student-id]') : null;
          if (studentEl) {
            state.selectedStudentId = studentEl.getAttribute('data-student-id');
            renderStage();
            renderStudentDetail();
            return;
          }
          var coords = getSvgCoords(e);
          if (!isInsideOurRoom(coords.x, coords.y)) return;
          if (state.viewMode === 'proctor' && state.proctorPosture === 'fixed') {
            state.isDraggingAim = true;
            aimHeadAt(coords.x, coords.y);
          } else if (state.viewMode === 'proctor' && state.proctorPosture === 'patrol') {
            state.walkTarget = {
              x: Math.max(OUR_ROOM.xMin + 24, Math.min(OUR_ROOM.xMax - 24, coords.x)),
              y: Math.max(OUR_ROOM.yMin + 24, Math.min(OUR_ROOM.yMax - 24, coords.y))
            };
          }
        });
        elSvg.addEventListener('pointermove', function (e) {
          if (!state.isDraggingAim) return;
          if (state.viewMode !== 'proctor' || state.proctorPosture !== 'fixed') return;
          var coords = getSvgCoords(e);
          aimHeadAt(coords.x, coords.y);
        });
        window.addEventListener('pointerup', function () {
          state.isDraggingAim = false;
        });

        // Delegated Click Handlers for Dynamic Panels & Modals
        document.addEventListener('click', function (e) {
          var target = e.target;
          if (!target || !target.closest) return;

          var jumpEl = target.closest('[data-jump-student]');
          if (jumpEl) {
            state.selectedStudentId = jumpEl.getAttribute('data-jump-student');
            renderStage();
            renderStudentDetail();
            return;
          }

          var selEl = target.closest('[data-select-student]');
          if (selEl) {
            state.selectedStudentId = selEl.getAttribute('data-select-student');
            renderStage();
            renderStudentDetail();
            return;
          }

          var walkEl = target.closest('[data-walk-near]');
          if (walkEl) {
            var st = findStudent(walkEl.getAttribute('data-walk-near'));
            if (st) {
              state.viewMode = 'proctor';
              state.proctorPosture = 'patrol';
              state.walkTarget = { x: st.x, y: Math.max(OUR_ROOM.yMin + 28, st.y - 44) };
              renderAll();
            }
            return;
          }

          var expelEl = target.closest('[data-expel-student]');
          if (expelEl) {
            expelStudent(expelEl.getAttribute('data-expel-student'));
            return;
          }

          var holdEl = target.closest('[data-hold-student]');
          if (holdEl) {
            holdStudent(holdEl.getAttribute('data-hold-student'));
            return;
          }

          var clearEl = target.closest('[data-clear-student]');
          if (clearEl) {
            clearStudent(clearEl.getAttribute('data-clear-student'));
            return;
          }

          var openLaterEl = target.closest('[data-open-later]');
          if (openLaterEl) {
            state.laterTargetId = openLaterEl.getAttribute('data-open-later');
            state.resultModalOpen = false;
            state.laterModalOpen = true;
            renderAll();
            return;
          }

          var laterSel = target.closest('[data-later-select]');
          if (laterSel) {
            state.laterTargetId = laterSel.getAttribute('data-later-select');
            renderLaterModal();
            return;
          }

          var holdRfEl = target.closest('[data-hold-rf]');
          if (holdRfEl) {
            var stRf = findStudent(holdRfEl.getAttribute('data-hold-rf'));
            if (stRf) { stRf.holdRfChecked = true; renderLaterModal(); }
            return;
          }

          var holdPhysEl = target.closest('[data-hold-phys]');
          if (holdPhysEl) {
            var stPh = findStudent(holdPhysEl.getAttribute('data-hold-phys'));
            if (stPh) { stPh.holdPhysicalChecked = true; renderLaterModal(); }
            return;
          }

          if (target.id === 'btn-later-empty-close') {
            state.laterModalOpen = false;
            renderLaterModal();
          }
        });

        // Keyboard Controls
        window.addEventListener('keydown', function (e) {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
          var key = e.key.toLowerCase();
          if (key === 'w' || key === 'a' || key === 's' || key === 'd' ||
              key === 'arrowup' || key === 'arrowdown' || key === 'arrowleft' || key === 'arrowright') {
            if (key.indexOf('arrow') === 0) e.preventDefault();
            pressedKeys[key] = true;
            if (state.proctorPosture === 'patrol') state.walkTarget = null;
            if (state.proctorPosture === 'fixed' && (key === 'a' || key === 'd' || key === 'arrowleft' || key === 'arrowright')) {
              state.autoSweep = false;
            }
          }
        });
        window.addEventListener('keyup', function (e) {
          delete pressedKeys[e.key.toLowerCase()];
        });

        // Smooth Animation & Simulation Tick Loop (40ms frame)
        window.setInterval(function () {
          if (state.isPaused) return;
          var needsRender = false;

          if (state.viewMode === 'proctor' && state.proctorPosture === 'fixed') {
            var delta = 0;
            if (pressedKeys.a || pressedKeys.arrowleft) delta += 2.4;
            if (pressedKeys.d || pressedKeys.arrowright) delta -= 2.4;
            if (delta !== 0) {
              state.headOffsetDeg = Math.max(-68, Math.min(68, Math.round((state.headOffsetDeg + delta) * 10) / 10));
              needsRender = true;
            } else if (state.autoSweep) {
              var nextAngle = state.headOffsetDeg + 1.2 * state.simSpeed * state.sweepDir;
              if (nextAngle >= 64) { nextAngle = 64; state.sweepDir = -1; }
              if (nextAngle <= -64) { nextAngle = -64; state.sweepDir = 1; }
              state.headOffsetDeg = nextAngle;
              needsRender = true;
            }
          }

          if (state.viewMode === 'proctor' && state.proctorPosture === 'patrol') {
            var vx = 0;
            var vy = 0;
            if (pressedKeys.w || pressedKeys.arrowup) vy -= 1;
            if (pressedKeys.s || pressedKeys.arrowdown) vy += 1;
            if (pressedKeys.a || pressedKeys.arrowleft) vx -= 1;
            if (pressedKeys.d || pressedKeys.arrowright) vx += 1;
            var speedPx = 7.5 * state.simSpeed;

            if (vx !== 0 || vy !== 0) {
              var len = Math.hypot(vx, vy);
              var nx = (vx / len) * speedPx;
              var ny = (vy / len) * speedPx;
              state.patrolHeadingDeg = radToDeg(Math.atan2(ny, nx));
              state.proctorPos.x = Math.max(OUR_ROOM.xMin + 24, Math.min(OUR_ROOM.xMax - 24, state.proctorPos.x + nx));
              state.proctorPos.y = Math.max(OUR_ROOM.yMin + 24, Math.min(OUR_ROOM.yMax - 24, state.proctorPos.y + ny));
              needsRender = true;
            } else if (state.walkTarget) {
              var dx = state.walkTarget.x - state.proctorPos.x;
              var dy = state.walkTarget.y - state.proctorPos.y;
              var dist = Math.hypot(dx, dy);
              if (dist <= speedPx) {
                state.proctorPos.x = state.walkTarget.x;
                state.proctorPos.y = state.walkTarget.y;
                state.walkTarget = null;
              } else {
                var wnx = (dx / dist) * speedPx;
                var wny = (dy / dist) * speedPx;
                state.patrolHeadingDeg = radToDeg(Math.atan2(wny, wnx));
                state.proctorPos.x += wnx;
                state.proctorPos.y += wny;
              }
              needsRender = true;
            }
          }

          if (needsRender) {
            runRfScan();
            renderHeaderAndToolbar();
            renderStage();
            renderSubtitleBar();
            renderStudentDetail();
            renderTabs();
          }

          simTickCounter += 1;
          var ticksPerSecond = state.simSpeed === 2 ? 12 : 25;
          if (simTickCounter >= ticksPerSecond) {
            simTickCounter = 0;
            stepSimulationSecond();
            renderHeaderAndToolbar();
            renderStage();
            renderSubtitleBar();
            renderStudentDetail();
            renderTabs();
          }
        }, 40);

        // Standalone index.html Download Handler
        function downloadStandaloneHtml() {
          var clone = document.documentElement.cloneNode(true);
          var clearIds = [
            'header-meta',
            'classroom-svg',
            'subtitle-bar',
            'student-detail-card',
            'tab-content',
            'later-modal-body',
            'result-modal-body'
          ];
          for (var i = 0; i < clearIds.length; i++) {
            var node = clone.querySelector('#' + clearIds[i]);
            if (node) node.innerHTML = '';
          }
          var stageCard = clone.querySelector('#stage-card');
          if (stageCard) stageCard.className = 'stage-card';
          var laterModal = clone.querySelector('#later-modal');
          if (laterModal) laterModal.className = 'modal-backdrop hidden';
          var resultModal = clone.querySelector('#result-modal');
          if (resultModal) resultModal.className = 'modal-backdrop hidden';

          var htmlContent = '<!doctype html>\n' + clone.outerHTML;
          var blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          link.href = url;
          link.download = 'index.html';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          window.setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
        }

        document.getElementById('btn-download-html').addEventListener('click', downloadStandaloneHtml);

        // Initial Render
        runRfScan();
        renderAll();
      })();
    </script>
